services:
  home-netflix:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./Movies:/app/Movies
      - ./Covers:/app/Covers
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ~/Videos:/root/Videos
      - type : bind
        source : /media
        target : /media
        bind:
          propagation : rshared